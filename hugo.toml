
title = "Androcode"
baseurl = "https://irha.my.id"

# Agar front-matter pakai format YAML
MetaDataFormat = "yaml"

# untuk apply temanya
themesDir = "themes"
theme = "ai"

# Shortname disqus, silahkan sesuaikan
DisqusShortname = "irhamidn"

# Untuk Google Analytic, silahkan sesuikan
googleAnalytics = "G-NKBLBPPY63"

ignoreLogs = ['warning-goldmark-raw-html']


# Pagination
[pagination]
  pagerSize = 8

  # --- AdSense ---
  # Kosongkan dulu sampai akun disetujui, supaya situs tetap
  # bersih & cepat saat direview oleh tim AdSense.
  adsenseClientID = "pub-3326955000767355"   # contoh: "ca-pub-1234567890123456"
  adSlotTop = ""
  adSlotBottom = ""
  adSlotArticle = ""

  # Verifikasi Google Search Console (opsional tapi disarankan)
  googleSiteVerification = "7Dk8iV2OnDL5TMjJ-G3R6b65As84eDfNQrpmrfeGz04"

[menu]
  [[menu.main]]
    name = "Beranda"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "Tentang"
    url = "/about/"
    weight = 3
  [[menu.main]]
    name = "Kontak"
    url = "/contact/"
    weight = 4

  [[menu.footer]]
    name = "Kebijakan Privasi"
    url = "/privacy-policy/"
    weight = 1
  [[menu.footer]]
    name = "Disclaimer"
    url = "/disclaimer/"
    weight = 2
  [[menu.footer]]
    name = "Kontak"
    url = "/contact/"
    weight = 3

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[minify]
  disableXML = true

# Aktifkan output JSON di beranda untuk index pencarian (/index.json)
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Untuk deskripsi tag meta di homepage
# Biodata Author
[params]
    author = "Irham"
    homepage = "https://github.com/irhamfa"
    bio = "Asik By : Susanti"
    authorImage = "/img/face.svg"



    Description = "Make a Move : Learn by learn"

	keywords  = [
    "sass", "ssg", "static site",
    "jekyll", "hugo", "hexo", "11ty", "eleventy",
    "bootstrap", "bulma", "materialize", "python", "html",
    "django", "flask", "c/c++", "java", "css", "sass",
    "linux", "tailwindcss", "flask", "django", "html"
  ]

[security]
  allowContent = ['^text/.*']

enableRobotsTXT = true

[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.5
