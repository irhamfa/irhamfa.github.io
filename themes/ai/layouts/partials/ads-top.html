{{ if and .Site.Params.adsenseClientID .Site.Params.adSlotTop }}
<div class="ad-slot ad-slot-top container">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="{{ .Site.Params.adsenseClientID }}"
       data-ad-slot="{{ .Site.Params.adSlotTop }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{{ end }}
