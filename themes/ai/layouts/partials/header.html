<header class="site-header">
  <div class="container site-header-inner">
    <a class="site-brand" href="{{ .Site.BaseURL }}">
      {{ with .Site.Params.logo }}
        <img src="{{ . | relURL }}" alt="{{ $.Site.Title }}" class="site-logo">
      {{ else }}
        <span class="site-title">{{ .Site.Title }}</span>
      {{ end }}
    </a>

    <nav id="site-nav" class="site-nav">
      <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>

    <div class="header-actions">
      <button id="search-toggle" class="search-toggle" aria-label="Buka pencarian" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5A4.5 4.5 0 0 1 9.5 14"/>
        </svg>
      </button>

      <button id="nav-toggle" class="nav-toggle" aria-label="Buka menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  {{ partial "search-modal.html" . }}
</header>
